<!doctype html>
<html>
    <head>
        <title>Minecraft - Lumiverse</title>
        <link rel="stylesheet" href="assets/documents/minecraft/minecraft.css" />
    </head>
    <header>
        <h1>
            <a href="../"><img src="./assets/images/minecraft/lumiverse_title.webp" /></a>
        </h1>
    </header>
    <body>
        <div id="contentContainer">
            <input
                type="text"
                spellcheck="false"
                placeholder="Search for mods . . ."
                id="searchBox"
                autocomplete="off"
                autofocus
            />
            <div id="noModsText" class="dropShadow hidden">
                <span>No mods found!</span>
            </div>
            <div id="modBoxes">
                {% for mod in mods %}
                <div class="modBox">
                    <div class="image">
                        <img
                            src="{{ mod.icon }}"
                            title="{{ mod.name }}"
                        />
                    </div>
                    <div class="text">
                        <span class="modName dropShadow" title="{{ mod.name }}">{{ mod.name }}</span>
                        <span class="links">
                            {% for url in mod.urls %}
                            <a href="{{ url }}" target="_blank">
                                <img class="dropShadow"
                                    src="
                                    {% if "modrinth" in url %}
                                        ./assets/images/minecraft/icon_modrinth.webp" style="--dropshadow-colour: #1cda6c" title="Modrinth"
                                    {% elif "github" in url %}
                                        ./assets/images/minecraft/icon_github.webp" style="--dropshadow-colour: black" title="GitHub"
                                    {% else %}
                                        ./assets/images/minecraft/icon_curseforge.webp" style="--dropshadow-colour: #f16436" title="CurseForge"
                                    {% endif %}
                                />
                            </a>
                            {% endfor %}</span
                        >
                    </div>
                </div>
                {% endfor %}
            </div>
        </div>
    </body>
    <footer>
        <p>© 2026 LumiLovesYou</p>
        <p id="affiliationText">Not affiliated with Mojang AB or Microsoft</p>
        <a href="https://github.com/lumilovesyou/lumiverse" target="_blank">Source on GitHub</a>
    </footer>
    <script src="./assets/documents/minecraft/minecraft.js"></script>
</html>
