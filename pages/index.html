<!doctype html>
<html>
    <head>
        <title>Lumiverse</title>
        <script src="./assets/documents/index.js"></script>
        <link rel="stylesheet" href="./assets/documents/style.css" />
    </head>
    <header>
        <marquee direction="left">
            {% for url in urls %}
            <a href="{{ url.url }}" target="_blank">{{ url.text }}</a>
            {% if not loop.last %}<span> / </span>{% endif %}{% endfor %}
        </marquee>

        <h1>Lumiverse</h1>
        {% if quote.url %}
        <h2><a href="{{ quote.url }}">{{ quote.text }}</a></h2>
        {% else %}
        <h2>{{ quote.text|safe }}</h2>
        {% endif %}
    </header>
    <body></body>
    <footer></footer>
    <script>
        //Just here because I'm too lazy to reload the page every time
        /*async function reload() {
            await new Promise((resolve) => setTimeout(resolve, 1000));
            location.reload();
        }*/
        reload();
    </script>
</html>
