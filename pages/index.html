<!doctype html>
<html>
    <head>
        <title>Lumiverse</title>
        <link rel="stylesheet" href="./assets/documents/style.css" />
    </head>
    <header>
        <div id="marquee">
            <div class="track">
                {% for url in urls %}
                <span>
                    <a href="{{ url.url }}" target="_blank"> {{ url.text }}</a>
                    <span>/</span>
                </span>
                {% endfor %}
            </div>
        </div>
        <script src="./assets/documents/index.js"></script>

        <h1>Lumiverse</h1>
        {% if quote.url %}
        <h2><a href="{{ quote.url }}">{{ quote.text }}</a></h2>
        {% else %}
        <h2>{{ quote.text|safe }}</h2>
        {% endif %}
    </header>
    <body></body>
    <footer></footer>
    <script>
        //Just here because I'm too lazy to reload the page every time
        /*async function reload() {
            await new Promise((resolve) => setTimeout(resolve, 1000));
            location.reload();
        }
        reload();*/
    </script>
</html>
